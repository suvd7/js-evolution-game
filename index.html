<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tech Evolution Game</title>
  <link rel="stylesheet" href="index.css">
  <!-- the font copied from internet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">

</head>
<body>
  <div id="start-screen" class="">
    <h1>MERGE JS TERMINAL</h1>
    <form class="form" action="./middle.html" method="get">
      <span>Name:</span>
      <input name="name" type="text" required id="player-name" placeholder="Enter your name">
      <span>Difficulty:</span>
      <select name="level" id="difficulty-level">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button type="submit" id="start-game">Start Game</button>
    </form>
  </div>
</body>
</html>
